name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PSScriptAnalyzer)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - name: Install PSScriptAnalyzer
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          # The runner image has the NuGet provider; installing it again would need the network
          if (-not (Get-PackageProvider -ListAvailable -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Analyze
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          # Default rules plus syntax that Windows PowerShell 5.1 cannot parse
          $settings = @{ Rules = @{ PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @('5.1') } } }
          $files = @(Get-Item -LiteralPath 'chrome-gemini-unlock.ps1') + @(Get-ChildItem -Path 'tests' -Filter '*.ps1')
          $findings = @(foreach ($f in $files) { Invoke-ScriptAnalyzer -Path $f.FullName -Settings $settings })
          $findings | Where-Object { [string]$_.Severity -ne 'Information' } |
            Format-Table -AutoSize ScriptName, Line, Severity, RuleName, Message | Out-String -Width 4096 | Write-Host
          $blocking = @($findings | Where-Object { $_.RuleName -eq 'PSUseCompatibleSyntax' -or @('Error', 'ParseError') -contains [string]$_.Severity })
          Write-Host "$($files.Count) files, $($findings.Count) findings, $($blocking.Count) blocking (PSUseCompatibleSyntax 5.1 or severity Error)"
          if ($blocking.Count) { exit 1 }

  unit-windows:
    name: Unit tests (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - name: Install Pester
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          # The runner image has the NuGet provider; installing it again would need the network
          if (-not (Get-PackageProvider -ListAvailable -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester
        run: |
          $PSVersionTable | Out-String | Write-Host
          Import-Module Pester -RequiredVersion 5.7.1
          $result = Invoke-Pester -Path 'tests/unit.Tests.ps1' -Output Detailed -PassThru
          if ($result.Result -ne 'Passed') { exit 1 }

  unit-linux:
    name: Unit tests (PowerShell 7, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Install Pester
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester
        run: |
          $PSVersionTable | Out-String | Write-Host
          Import-Module Pester -RequiredVersion 5.7.1
          $result = Invoke-Pester -Path 'tests/unit.Tests.ps1' -Output Detailed -PassThru
          if ($result.Result -ne 'Passed') { exit 1 }

  chrome-flags-windows:
    name: Chrome flags (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - name: Check the flags against Google Chrome
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\chrome-flags.ps1

  chrome-flags-linux:
    name: Chrome flags (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Check the flags against Google Chrome
        run: |
          google-chrome --version
          pwsh -NoProfile -File tests/chrome-flags.ps1

  e2e-windows:
    name: End-to-end (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - name: Run chrome-gemini-unlock.ps1 against the real Chrome profile
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\e2e.ps1
