name: Release

# Publishes a release, but only after every test passes on that commit. Two ways to start it:
#   - push a tag:  git tag v1.2.3 && git push origin v1.2.3
#   - by hand on main: Actions -> Release -> Run workflow, version v1.2.3 (the tag is created then)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like v1.2.3. Its section must exist in CHANGELOG.md.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml

  release:
    name: Publish the release
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # The input goes through an environment variable, never straight into a script
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the version of a run started by hand
        if: github.event_name == 'workflow_dispatch'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The version must look like v1.2.3, got '$TAG'"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Run it on main, not $GITHUB_REF"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists"; exit 1
          fi
      - name: Build the ZIP, its SHA-256 and the release notes
        run: bash tools/build-release.sh "$TAG" dist "$GITHUB_SHA"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag must already exist; a run started by hand creates it on the tested commit
          verify=()
          if [ "$GITHUB_EVENT_NAME" = push ]; then verify=(--verify-tag); fi
          gh release create "$TAG" \
            "dist/chrome-gemini-unlock-$TAG.zip" \
            "dist/chrome-gemini-unlock-$TAG.zip.sha256" \
            --title "Chrome Gemini Unlock $TAG" \
            --notes-file dist/notes.md \
            --target "$GITHUB_SHA" \
            "${verify[@]}"
